<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning voor redacteuren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: the app's own frame (aubergine menu left, light work area right), one chapter at a time, steps as a numbered column with the screen beside it. */
:root {
  --purple: #713C80; --purple-2: #8E55A0; --pink: #E92E7F; --ink: #2A1430;
  --bg: #F7F5F9; --surface: #FFFFFF; --surface-2: #F0ECF3; --line: #E3DCE8;
  --fg: #1B1320; --muted: #6B5F72; --side: #2A1430; --side-fg: #DCCFE2; --side-dim: #A28EAB;
  --ok: #1DB97A; --warn: #F5A524; --info: #2FA6DF; --accent: var(--purple); --on-accent: #fff;
  --tip-bg: #F3ECF6; --warn-bg: #FFF5E3;
  --display: "Epilogue", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px;
  --shadow: 0 1px 2px rgb(42 20 48 / .06), 0 6px 20px rgb(42 20 48 / .07);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --accent: #B57FC6; --bg: #0E0911; --surface: #18101C; --surface-2: #221727; --line: #352840;
  --fg: #EFE9F2; --muted: #A396AA; --side: #120A15; --tip-bg: #241a2a; --warn-bg: #2a2114; color-scheme: dark; } }
:root[data-theme="dark"] {
  --accent: #B57FC6; --bg: #0E0911; --surface: #18101C; --surface-2: #221727; --line: #352840;
  --fg: #EFE9F2; --muted: #A396AA; --side: #120A15; --tip-bg: #241a2a; --warn-bg: #2a2114; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15.5px/1.6 var(--body); }
img { max-width: 100%; }
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 100vh; }
/* Sidebar */
.side { background: var(--side); color: var(--side-fg); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; padding: 22px 14px 18px max(14px, env(safe-area-inset-left, 0px)); }
.side .logo { display: block; width: 132px; margin: 4px 10px 6px; }
.side .tag { margin: 0 10px 22px; font-size: 12.5px; color: var(--side-dim); }
.side h2 { font: 600 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--side-dim); margin: 0 10px 10px; }
.nav { display: grid; gap: 4px; }
.nav a { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: var(--r-md); color: var(--side-fg); text-decoration: none; font-weight: 500; }
.nav a:hover { background: rgb(255 255 255 / .06); }
.nav a[aria-current="page"] { background: linear-gradient(90deg, var(--purple), var(--purple-2)); color: #fff; }
.nav .ring { width: 30px; height: 30px; }
.nav .ring circle { fill: none; stroke-width: 3.2; }
.nav .ring .bgc { stroke: rgb(255 255 255 / .14); }
.nav .ring .fgc { stroke: var(--pink); stroke-linecap: round; transition: stroke-dashoffset .4s; transform: rotate(-90deg); transform-origin: 50% 50%; }
.nav .ring text { fill: currentColor; font: 700 11px var(--body); }
.nav small { font: 500 11.5px var(--mono); color: var(--side-dim); }
.nav a[aria-current="page"] small { color: #f3e6f7; }
.side .foot { margin-top: auto; padding: 18px 10px 0; font-size: 12.5px; color: var(--side-dim); border-top: 1px solid rgb(255 255 255 / .08); }
.side .foot b { color: var(--side-fg); font-weight: 600; }
.reset { background: none; border: 0; color: var(--side-dim); text-decoration: underline; cursor: pointer; padding: 0; font: inherit; }

/* Main */
main { min-width: 0; padding-block: 40px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: clamp(0px, 3vw, 32px); }
.chapter.off { display: none; }
.eyebrow { font: 600 12px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--pink); margin: 0 0 8px; }
h1 { font: 800 clamp(30px, 4.2vw, 46px)/1.08 var(--display); letter-spacing: -.02em; margin: 0 0 14px; text-wrap: balance; }
h3 { font: 700 21px/1.25 var(--display); margin: 0; text-wrap: balance; }
.lead { font-size: 18px; color: var(--muted); max-width: 64ch; margin: 0 0 26px; }
.where { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13.5px; color: var(--muted); margin-bottom: 26px; }
.crumb { background: var(--surface-2); color: var(--fg); border-radius: 999px; padding: 3px 11px; font-weight: 600; }

/* Video */
.video { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 0; background: var(--ink); color: #fff; border-radius: var(--r-lg); overflow: hidden; margin-bottom: 40px; box-shadow: var(--shadow); }
.video video { width: 100%; height: 100%; display: block; background: #000; aspect-ratio: 16/10; object-fit: contain; }
.video .vtext { padding: 26px 26px; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.video .vtext b { font: 700 19px/1.3 var(--display); }
.video .vtext span { color: #DCCFE2; font-size: 14.5px; }
.video .len { font: 500 12px var(--mono); color: var(--pink); letter-spacing: .04em; }
.video .printnote { display: none; }

/* Steps */
.steps { display: grid; gap: 22px; counter-reset: step; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 28px; align-items: start; }
.step.textonly { grid-template-columns: minmax(0, 1fr); }
.step-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px; }
.num { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--accent); font: 700 15px var(--display); }
.step.done .num { background: var(--ok); color: #fff; }
.step ol, .step ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; }
.step p { margin: 8px 0 0; }
.marker { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--pink); color: #fff; font: 700 11.5px var(--body); vertical-align: 2px; margin-right: 2px; }
.ui { font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; white-space: nowrap; }
.donebox { display: flex; align-items: center; gap: 9px; margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); font-size: 14px; color: var(--muted); cursor: pointer; width: fit-content; }
.donebox input { width: 18px; height: 18px; accent-color: var(--ok); cursor: pointer; }
.shots { display: grid; gap: 12px; }
.shots.phone { grid-template-columns: 1fr 1fr; max-width: 460px; }
figure { margin: 0; }
.shot { display: block; padding: 0; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; cursor: zoom-in; background: var(--surface-2); width: 100%; }
.shot img { display: block; width: 100%; height: auto; }
.shot:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
figcaption { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.tip, .warn { border-radius: var(--r-md); padding: 12px 14px; margin-top: 14px; font-size: 14.5px; }
.tip { background: var(--tip-bg); border-left: 4px solid var(--accent); }
.warn { background: var(--warn-bg); border-left: 4px solid var(--warn); }
.tip b, .warn b { display: block; margin-bottom: 2px; }

/* Welcome page pieces */
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin: 6px 0 34px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 6px; }
.card:hover { border-color: var(--accent); }
.card .k { font: 500 12px var(--mono); color: var(--pink); }
.card b { font: 700 17px/1.25 var(--display); }
.card span { color: var(--muted); font-size: 14px; }
.hour { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; margin-bottom: 30px; }
.hour h3 { margin-bottom: 4px; }
.hour p { margin: 0 0 16px; color: var(--muted); }
.bar { display: flex; height: 54px; border-radius: 9px; overflow: hidden; font: 600 12.5px/1.2 var(--body); color: #fff; }
.bar > div { display: flex; align-items: center; padding: 0 10px; min-width: 0; }
.bar .s1 { flex: 0 0 8%; background: var(--ink); }
.bar .s2 { flex: 0 0 48%; background: var(--purple); }
.bar .s3 { flex: 1; background: repeating-linear-gradient(135deg, #2FA6DF 0 10px, #4bb5e6 10px 20px); }
.ticks { display: flex; justify-content: space-between; font: 500 11.5px var(--mono); color: var(--muted); margin-top: 6px; }
.legend3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 16px; font-size: 14px; }
.legend3 i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.p-rec { background: #fde7ef; color: #b0175a; } .p-wait { background: #fff1d6; color: #8a5a00; } .p-ok { background: #d9f5e9; color: #0d7a4f; } .p-proc { background: var(--surface-2); color: var(--muted); } .p-bad { background: #fde2e5; color: #a3182b; }
.faq { display: grid; gap: 10px; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 4px 18px; }
summary { cursor: pointer; font-weight: 600; padding: 12px 0; list-style-position: outside; }
details p, details ul { margin: 0 0 14px; color: var(--fg); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; flex-wrap: wrap; }
.pager a { display: inline-flex; flex-direction: column; gap: 2px; padding: 12px 18px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--fg); min-width: 0; }
.pager a small { color: var(--muted); font-size: 12px; }
.pager a b { font-family: var(--display); }
.pager a.next { margin-left: auto; text-align: right; background: var(--purple); border-color: var(--purple); color: #fff; }
.pager a.next small { color: #eadcf0; }
.cheat { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cheat div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; }
.cheat b { display: block; font-family: var(--display); margin-bottom: 4px; }
.cheat span { color: var(--muted); font-size: 14px; }

/* Lightbox */
.lb { position: fixed; inset: 0; background: rgb(14 9 17 / .9); display: grid; place-items: center; z-index: 50; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.lb img { max-width: 100%; max-height: 92vh; border-radius: 8px; box-shadow: 0 20px 60px rgb(0 0 0 / .5); }
.lb p { color: #fff; margin: 10px 0 0; text-align: center; font-size: 14px; }

/* Cover (print only) */
.cover { display: none; }

@media (max-width: 1080px) {
  .step { grid-template-columns: minmax(0, 1fr); }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .video { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 20; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); flex-direction: row; align-items: center; gap: 12px; overflow-x: auto; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--side); }
  .side .logo { width: 84px; margin: 0; flex: none; }
  .side .tag, .side h2, .side .foot { display: none; }
  .nav { display: flex; gap: 4px; }
  .nav a { grid-template-columns: 24px auto; padding: 6px 10px; white-space: nowrap; font-size: 13.5px; }
  .nav a small { display: none; }
  .nav .ring { width: 24px; height: 24px; }
  main { padding-block: 24px 60px; }
  .two, .cheat, .legend3 { grid-template-columns: minmax(0, 1fr); }
  .step { padding: 18px; }
}
@media (max-width: 480px) { .cards { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

@media print {
  @page { size: A4; margin: 14mm 13mm 16mm; }
  :root { --bg: #fff; --surface: #fff; }
  body { font-size: 10.5pt; line-height: 1.5; background: #fff; }
  .app { display: block; }
  .side, .donebox, .pager, .lb, .video video, .resetwrap { display: none !important; }
  main { padding: 0; }
  .wrap { max-width: none; padding: 0; }
  .chapter, .chapter.off { display: block !important; break-before: page; }
  .cover { display: flex; flex-direction: column; justify-content: space-between; height: 262mm; background: var(--ink); color: #fff; padding: 22mm 18mm; border-radius: 6mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .cover img { width: 62mm; }
  .cover h1 { color: #fff; font-size: 34pt; margin: 0 0 6mm; }
  .cover p { color: #DCCFE2; font-size: 13pt; max-width: 130mm; margin: 0; }
  .cover .toc { display: grid; gap: 3mm; font-size: 12pt; margin-top: 12mm; }
  .cover .toc span { color: var(--pink); font-family: var(--mono); margin-right: 4mm; }
  .cover small { color: #A28EAB; font-size: 9.5pt; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .video { display: flex; background: var(--surface-2); color: var(--fg); box-shadow: none; break-inside: avoid; margin-bottom: 8mm; }
  .video .vtext { padding: 4mm 5mm; }
  .video .vtext span { color: var(--muted); }
  .video .printnote { display: block; font-size: 9.5pt; color: var(--purple); }
  .step { display: block; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 6mm 0 2mm; }
  .step .shots { margin-top: 4mm; }
  .step-text { break-inside: avoid; }
  figure { break-inside: avoid; }
  .shot { border: 1px solid #ddd; }
  .shot img { max-height: 98mm; width: auto; max-width: 100%; margin: 0 auto; }
  .shot { width: fit-content; max-width: 100%; margin: 0 auto; }
  .step .shots { grid-template-columns: 1fr; }
  .step .shots.phone { grid-template-columns: 1fr 1fr; max-width: 120mm; }
  .steps { gap: 0; }
  details { break-inside: avoid; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 0; }
  details > summary { list-style: none; }
  .cards .card, .hour, .cheat div { break-inside: avoid; }
  a { color: inherit; text-decoration: none; }
}
</style>

<body>

<div class="app">
  <aside class="side" aria-label="Hoofdstukken">
    <img class="logo" src="img/logo-on-dark.svg" alt="IJmond360">
    <p class="tag">Handleiding planning voor de redactie</p>
    <h2>Hoofdstukken</h2>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <p style="margin:0 0 8px">Vink stappen af als je ze gedaan hebt. Je voortgang blijft in deze browser bewaard.</p>
      <p class="resetwrap" style="margin:0"><button class="reset" id="reset" type="button">Voortgang wissen</button></p>
      <p style="margin:12px 0 0">TV Station Manager <b>0.9.1</b> · november 2026</p>
    </div>
  </aside>
  <main><div class="wrap" id="content"></div></main>
</div>
<div class="lb" id="lb" hidden><figure><img id="lbimg" alt=""><p id="lbcap"></p></figure></div>

<script>
const T = (s) => s; // copy is Dutch only; the app itself is EN + NL
const ui = (s) => `<span class="ui">${s}</span>`;
const m = (n) => `<span class="marker">${n}</span>`;

const CH = [
{ id: 'start', short: 'Welkom', title: 'Zo plan je televisie', eyebrow: 'Begin hier', lead: 'Met deze handleiding vul je zelf de weekplanning van IJmond360: je bouwt uurblokken, sleept ze in de week, plant live-uitzendingen en maakt van opnames herhalingen. Elke stap heeft een schermafbeelding, elk hoofdstuk een korte video.' },
{ id: 'uurblok', short: 'Uurblok vullen', title: 'Een uurblok vullen', eyebrow: 'Hoofdstuk 1', where: ['Redactie', 'Blokken'],
  lead: 'Een blok is één uur televisie. Bovenaan staat vanzelf de vaste start van het uur, daaronder zet jij de items, en de rest van het uur loopt vanzelf vol.',
  video: { src: 'video/video-1-uurblok.mp4', poster: 'video/video-1-uurblok.jpg', len: '0:55', title: 'Een uurblok maken in één minuut', text: 'Nieuw blok, een programma erin, het nieuws dat zichzelf kiest, een reclameblok en de beeldkrant als opvulling.' } },
{ id: 'week', short: 'Weekplanning', title: 'De weekplanning vullen', eyebrow: 'Hoofdstuk 2', where: ['Redactie', 'Weekplanning'],
  lead: 'De weekplanning is een rooster van uren. Je sleept er blokken in en kiest op welke dagen ze terugkomen. Wat hier staat gaat elke week vanzelf de lucht in.',
  video: { src: 'video/video-2-weekplanning.mp4', poster: 'video/video-2-weekplanning.jpg', len: '0:23', title: 'Een blok in de week zetten', text: 'Slepen, dagen kiezen met Ma–vr, en het blok langer maken door aan de onderrand te trekken.' } },
{ id: 'live', short: 'Live uitzenden', title: 'Een live-uitzending plannen', eyebrow: 'Hoofdstuk 3', where: ['Redactie', 'Weekplanning', 'Live plannen'],
  lead: 'Een live-uitzending leg je over de weekplanning heen, met een dag, begin- en eindtijd. Komt er iets binnen zonder planning, dan zet je het met één knop op zender bij Schakelen.',
  video: { src: 'video/video-3-live.mp4', poster: 'video/video-3-live.jpg', len: '0:59', title: 'Live plannen en live schakelen', text: 'Een gemeenteraad inplannen, en een onverwachte stream live zetten met opname en herhaling.' } },
{ id: 'opnames', short: 'Opnames', title: 'Opnames knippen en herhalen', eyebrow: 'Hoofdstuk 4', where: ['Redactie', 'Bibliotheek', 'Opnames'],
  lead: 'Elke live-uitzending die via een stream binnenkomt wordt vanzelf opgenomen. Jij knipt het begin en einde bij, zet hem in de bibliotheek en plant de herhaling.',
  video: { src: 'video/video-4-opnames.mp4', poster: 'video/video-4-opnames.jpg', len: '0:44', title: 'Een opname knippen en herhalen', text: 'Begin en einde zetten, naar de bibliotheek, en met een snelknop een herhaling inplannen.' } },
{ id: 'regionaal', short: 'Regionale info', title: 'Verkeer, evenementen, raad en 112', eyebrow: 'Hoofdstuk 5', where: ['Bibliotheek', 'Beeldkranten', 'Regionaal'],
  lead: 'Kant-en-klare beeldkranten met regionale informatie voor Velsen, Beverwijk en Heemskerk: files en wegwerkzaamheden, evenementen, de agenda van de gemeenteraden en 112-meldingen. Je zet een bron aan, maakt er met één klik een beeldkrant van en zet die in een uurblok. Daarna ververst alles vanzelf.' },
{ id: 'mobiel', short: 'Op je telefoon', title: 'Plannen met je telefoon', eyebrow: 'Hoofdstuk 6', where: ['Inloggen op je telefoon'],
  lead: 'Log je in op je telefoon, dan past het scherm zich vanzelf aan. Het menu staat onderin, blokken versleep je met je vinger en de weekplanning toont één dag tegelijk.' },
{ id: 'backup', short: 'Back-ups', title: 'Back-ups naar de NAS of OneDrive', eyebrow: 'Hoofdstuk 7 · beheer', where: ['Systeem', 'Back-up en herstel'],
  lead: 'Voor beheerders. De app maakt zelf back-ups van de planning, instellingen en bestanden, en zet ze op een veilige plek buiten de server: een share op de NAS (SMB) of een OneDrive. Ook de orchestrator heeft dit scherm. Gaat er iets mis, dan zet je met een paar klikken een back-up terug.' },
{ id: 'vragen', short: 'Vragen', title: 'Vragen en problemen', eyebrow: 'Naslag', lead: 'Iets werkt anders dan je verwacht? Hier staan de meest gestelde vragen, en een spiekbriefje met waar alles staat.' },
];

const STEPS = {
uurblok: [
 { t: 'Open de blokken', img: ['11-blokken', 'De pagina Blokken met links de lijst, in het midden het geopende blok en rechts de mediabibliotheek.'],
   b: `<p>Klik in het menu links op ${ui('Blokken')}.</p><ol><li>${m(1)} ${ui('Nieuw blok')} begint een leeg uurblok.</li><li>${m(2)} Klik op een bestaand blok in de lijst om het aan te passen.</li><li>${m(3)} Rechts staat de mediabibliotheek: alle clips van de UNAS, te filteren op categorie en map.</li></ol>
   <div class="tip"><b>Uurblokken en reclameblokken</b>Met de tabs bovenaan wissel je tussen uurblokken en reclameblokken. Een reclameblok maak je op dezelfde manier en zet je daarna als één regel in een uurblok.</div>` },
 { t: 'Geef het blok een naam, categorie en kleur', img: ['13-nieuw-blok', 'Een nieuw blok met naam Middagmagazine, categorie Cultuur en een kleur.'],
   b: `<ol><li>${m(1)} Typ een naam die de kijker ook in de programmagids ziet, bijvoorbeeld <i>Middagmagazine</i>.</li><li>${m(2)} Kies een categorie (Nieuws, Sport, Cultuur, Politiek).</li><li>${m(3)} Kies een kleur. Die kleur zie je straks terug in de weekplanning.</li></ol>
   <p>Bovenaan staan al twee regels op slot: de <b>vaste start</b> van elk uur (de zendertune en de Straks-slide). Die komt vanzelf voor elk uurblok en hoef je niet zelf toe te voegen.</p>` },
 { t: 'Zet er een programma of clip in', img: ['14-clip-plus', 'In de mediabibliotheek staat bij elke clip een plusje.'], img2: ['15-clip-toegevoegd', 'De clip staat in de rundown en in de uurbalk.'],
   b: `<p>Zoek de clip in de mediabibliotheek rechts. Je kunt typen in het zoekvak of op een categorie klikken.</p><ol><li>${m(1)} Klik op de regel van de clip om hem te zien.</li><li>${m(2)} Klik op het plusje erachter. Je kunt de clip ook met de muis naar de rundown slepen.</li></ol>
   <p>De clip komt onderaan de rundown en in de gekleurde uurbalk. Wil je de volgorde veranderen? Sleep de regel aan het bolletjesgreepje links, of gebruik de pijltjes.</p>` },
 { t: 'Laat het nieuws zichzelf kiezen', img: ['16-dynamisch-nieuws', 'Het venster Dynamisch onderdeel met map NIEUWS, keuze Nieuwste en 3 clips.'], img2: ['17-dynamisch-toegevoegd', 'Het dynamische onderdeel staat in de rundown.'],
   b: `<p>Voor nieuws wil je niet elk uur zelf clips kiezen. Klik op ${ui('Dynamisch uit map')}.</p><ol><li>Kies ${ui('Een map')}.</li><li>${m(2)} Kies de map, bijvoorbeeld <b>NIEUWS</b>.</li><li>${m(3)} Kies hoe hij moet kiezen: <b>Nieuwste</b>.</li><li>${m(4)} Vul in hoeveel clips, bijvoorbeeld 3.</li><li>${m(5)} Rechts zie je welke clips er nu zouden spelen.</li><li>Klik op ${ui('Toevoegen aan blok')}.</li></ol>
   <div class="tip"><b>Altijd vers</b>Bij elke uitzending kiest hij opnieuw. Komt er om 08:31 een nieuwe clip op de UNAS, dan speelt die om 09:00 en valt de oudste eruit.</div>
   <table style="margin-top:14px"><tr><th>Keuze</th><th>Handig voor</th></tr><tr><td><b>Om de beurt</b></td><td>Reclames en bumpers: elke clip komt aan de beurt.</td></tr><tr><td><b>Willekeurig</b></td><td>Afwisseling, nooit meteen dezelfde als vorige keer.</td></tr><tr><td><b>Nieuwste</b></td><td>Nieuws: de nieuwste clips, oude vallen eruit.</td></tr><tr><td><b>Nieuwste + willekeurig</b></td><td>Programma-items: eerst de nieuwste, daarna willekeurige andere.</td></tr></table>` },
 { t: 'Programma’s uit de weekmappen', img: ['22-nieuwste-willekeurig', 'Map PROGRAMMA met Alles in deze map en Nieuwste + willekeurig.'], img2: ['23-nieuwste-submap', 'Alleen de nieuwste submap pakt vanzelf de map van deze week.'],
   b: `<p>Staan de programma’s in een map per week (<i>PROGRAMMA/wk 44</i>, <i>wk 45</i>)? Kies dan de bovenste map <b>PROGRAMMA</b> en daarna:</p><ul><li><b>Alles in deze map</b> ${m(1)}: alle programma’s uit alle weekmappen. Combineer met ${m(2)} <b>Nieuwste + willekeurig</b> om eerst het nieuwste programma te tonen en daarna willekeurige oudere.</li><li><b>Alleen de nieuwste submap</b>: pakt vanzelf de map van deze week. Maandag staat wk 46 op de UNAS? Dan gebruikt hij die, zonder dat jij iets aanpast.</li></ul>
   <p>In één uitzending komt een clip nooit twee keer voor.</p>` },
 { t: 'Reclameblok, infopagina of Straks-slide erbij', img: ['18-meer-reclame-info', 'Het keuzemenu Meer: blok, infopagina, live met een reclameblok en een infopagina in de rundown.'],
   b: `<p>${m(1)} Gebruik het keuzemenu ${ui('Meer: blok, infopagina, live…')}. Je kiest daar:</p><ul><li>een <b>reclameblok</b> ${m(2)} (gemaakt onder de tab Reclameblokken),</li><li>een <b>infopagina</b>, bijvoorbeeld “Heb je nieuws?”,</li><li>de <b>Straks-slide</b> met de programma’s van het komende uur,</li><li>de <b>beeldkrant</b>, een <b>webcam</b> of een <b>live bron</b>.</li></ul>
   <p>Een regel met het label <i>logo uit</i> betekent dat het zenderlogo tijdens dat onderdeel uit beeld gaat. Dat is zo ingesteld bij Kanaal &amp; lagen.</p>` },
 { t: 'Vul de rest van het uur op', img: ['19-rest-van-uur', 'Het keuzemenu Klaar met de items? Vul de rest van het uur met, ingesteld op Beeldkrant IJmond.'],
   b: `<p>Je items zijn meestal korter dan een uur. Onderaan bij ${ui('Klaar met de items? Vul de rest van het uur met')} ${m(1)} kies je wat er daarna speelt:</p><ul><li>de <b>beeldkrant</b>,</li><li>een <b>webcam</b>,</li><li>of niets kiezen: dan speelt de vaste opvulling van het kanaal.</li></ul><p>Om precies :00 begint het volgende blok, weer met de vaste start.</p>` },
 { t: 'Opslaan en de uurbalk lezen', img: ['20-opslaan', 'De knop Opslaan rechtsboven in het blok.'], img2: ['21-blok-klaar', 'De uurbalk van :00 tot :60 met vaste start, items en de gestreepte beeldkrant.'],
   b: `<p>Klik rechtsboven op ${ui('Opslaan')} ${m(1)}. Zolang je dat niet doet, staat er <i>Niet opgeslagen wijzigingen</i>.</p><p>De uurbalk laat het hele uur zien, van <b>:00</b> tot <b>:60</b>:</p><div class="legend3"><span><i style="background:#2A1430"></i>donker: vaste start</span><span><i style="background:#713C80"></i>paars: jouw items</span><span><i style="background:#2FA6DF"></i>gestreept: opvulling tot het hele uur</span></div>
   <div class="warn"><b>Langer dan een uur?</b>Passen je items niet in een uur, dan loopt het blok door in het volgende uur. Maak in de weekplanning het blok dan 2 uur lang (zie hoofdstuk 2).</div>` },
],
week: [
 { t: 'Het rooster', img: ['30-weekplanning', 'De weekplanning met rechts de blokkenlijst en bovenaan de schakelaar.'],
   b: `<p>Klik in het menu op ${ui('Weekplanning')}. Je ziet maandag tot en met zondag, met de uren onder elkaar.</p><ol><li>${m(1)} Rechts staan alle blokken. Een slotje betekent: begint met de vaste start.</li><li>${m(2)} <b>De weekplanning stuurt het kanaal.</b> Deze schakelaar moet aan staan. Wat hier staat gaat de komende 14 dagen vanzelf de lucht in.</li></ol>
   <div class="warn"><b>Schakelaar niet uitzetten</b>Staat hij uit, dan gaat er niets uit de weekplanning de lucht in. Laat dat aan de eindredactie over.</div>` },
 { t: 'Sleep een blok in de week', img: ['31-slepen', 'Een blok wordt uit de lijst naar woensdag 14:00 gesleept.'], img2: ['32-geplaatst', 'Middagmagazine staat op woensdag 14:00 met de melding elke week.'],
   b: `<ol><li>${m(1)} Pak een blok in de lijst rechts vast met de muis.</li><li>Sleep het naar de dag en het uur waar het moet beginnen. Het vak kleurt mee.</li><li>Laat los. Bovenaan verschijnt bijvoorbeeld <i>Middagmagazine staat op wo 14:00, elke week</i>.</li></ol><p>Al een blok in het rooster? Sleep het naar een ander uur om het te verplaatsen.</p>` },
 { t: 'Kies op welke dagen het terugkomt', img: ['33-dagen-kiezen', 'Het paneel met de dagknoppen Ma tot Zo en de knoppen Ma–vr, Weekend en Elke dag.'],
   b: `<p>Klik op het blok in het rooster. Rechts opent een paneel.</p><ol><li>${m(1)} Klik dagen aan of uit. Het blok komt op die dagen op dezelfde tijd.</li><li>${m(2)} Snelknoppen: ${ui('Ma–vr')}, ${ui('Weekend')} of ${ui('Elke dag')}.</li><li>Bij <b>Lengte</b> kies je 1, 2 of 3 uur.</li><li>${m(3)} ${ui('Alleen 4 nov')} past alleen die ene datum aan (stap 5).</li></ol>
   <p>${ui('Blok openen')} brengt je naar het blok zelf. ${ui('Deze dag weghalen')} haalt het blok alleen van die dag.</p>` },
 { t: 'Langer of korter maken', img: ['34-langer-maken', 'Het greepje aan de onderrand van het blok.'],
   b: `<p>Ga met de muis naar de onderrand van het blok ${m(1)}. Trek hem naar beneden voor langer, naar boven voor korter. Het gaat per heel uur, tot het volgende blok of middernacht.</p><p>Alle dagen van dezelfde reeks veranderen mee.</p>` },
 { t: 'Alleen voor één datum iets anders', img: ['35-alleen-deze-datum', 'De rundown van één datum met de knoppen Blok bewerken en Eigen rundown voor deze datum.'],
   b: `<p>Klik in het paneel op ${ui('Alleen …')} met de datum. Je ziet wat er die dag in dat uur speelt.</p><ul><li>${ui('Blok bewerken')} past het blok aan, dus voor álle dagen waarop het staat.</li><li>${ui('Eigen rundown voor deze datum')} maakt een losse versie voor alleen die dag. Sleep er clips in vanuit de mediabibliotheek.</li></ul>` },
 { t: 'Wijzigingen in het uur dat nu loopt', img: ['36-nu-toepassen', 'De oranje melding Wijzigingen aan het uur dat nu loopt met de knop Nu toepassen.'],
   b: `<p>Pas je iets aan in het uur dat nú op zender is, dan verschijnt er een oranje melding ${m(1)}. De wijziging gaat dan pas in bij het volgende hele uur, zodat het programma dat nu speelt niet opnieuw begint.</p><p>Moet het toch meteen? Klik op ${ui('Nu toepassen')} ${m(2)}. Het lopende uur wordt dan direct opnieuw opgebouwd.</p>` },
 { t: 'Controleer wat er op zender is', img: ['01-nu-op-tv', 'Nu op TV over de volle breedte: links het item dat nu speelt, rechts alle items van het uurblok.'],
   b: `<p>Klik op ${ui('Nu op TV')}. Je ziet per kanaal welk uurblok loopt, welk item ${m(1)} nu speelt, hoeveel tijd er nog is en wat er hierna komt.</p><p>Rechts staan ${m(2)} alle items van het uurblok onder elkaar: wat al gespeeld is staat grijs, het item dat nu speelt is roze gemarkeerd met ${ui('Nu')}, daaronder komt de rest van het uur. Op een telefoon staat de lijst onder het item dat nu speelt.</p><p>Het volledige overzicht per dag staat bij ${ui('Uitzendschema')}; wat de kijker in de gids ziet bij ${ui('Programmagids')}.</p>` },
],
live: [
 { t: 'Live plannen', img: ['40-live-plannen', 'Het venster Live-uitzending plannen met bron, naam, dag, begin en einde.'],
   b: `<p>Ga naar ${ui('Weekplanning')} en klik op ${ui('Live plannen')}.</p><ol><li>${m(1)} Kies de <b>live bron</b>, bijvoorbeeld Raadzaal Velsen.</li><li>${m(2)} Geef een naam die de kijker in de gids ziet.</li><li>${m(3)} Kies de dag.</li><li>${m(4)} Begintijd en ${m(5)} eindtijd. De lengte wordt eronder berekend.</li><li>${m(6)} Klik op ${ui('Live plannen')}.</li></ol>
   <div class="tip"><b>Staat je bron er niet bij?</b>Live bronnen staan in de Bibliotheek onder de tab Live. Een nieuwe bron (met streamsleutel voor de inzender) laat je aanmaken door een beheerder.</div>` },
 { t: 'De live-uitzending in de week', img: ['41-live-in-week', 'De live-uitzending staat roze over de weekplanning op donderdag.'],
   b: `<p>De live-uitzending staat <b>roze</b> over de weekplanning heen ${m(1)}. Op dat moment wacht de gewone planning; na de eindtijd loopt hij vanzelf verder.</p><p>Toch niet live? Klik op het kruisje in het roze blok om hem weg te halen.</p>
   <div class="tip"><b>Wat er achter de schermen gebeurt</b>De ene studiocomputer neemt de stream binnen, de andere blijft de planning spelen. De regie schakelt pas naar live als het beeld er echt is. Komt er geen beeld, dan blijft de planning op zender. Je hoeft zelf niets aan de ATEM te doen.</div>` },
 { t: 'Onverwacht live: Schakelen', img: ['42-schakelen', 'De pagina Schakelen met knoppen Raadzaal Velsen live, Telstar live en Studio.'],
   b: `<p>Voor live beeld zonder planning (breaking news, een persconferentie) ga je naar ${ui('Schakelen')}.</p><ul><li>${m(1)} Een knop met een stream. Eronder zie je of er beeld binnenkomt.</li><li>${m(2)} Een camera in de studio. Eronder staat op welke aansluiting van de ATEM hij zit, bijvoorbeeld <b>SDI in 5</b>.</li><li>${m(3)} Wat er nu op zender is.</li></ul><p>De knoppen worden gemaakt door een beheerder. Zijn ze grijs, dan staat de ATEM vast in de orchestrator.</p>` },
 { t: 'Opnemen en herhalen', img: ['43-live-gaan-vragen', 'Het venster Live gaan met de vragen opnemen en herhalen.'],
   b: `<p>Klik op een stream-knop. Er komen twee vragen:</p><ol><li>${m(1)} <b>Wil je deze live-uitzending opnemen?</b></li><li>${m(2)} <b>Wil je de opname direct na de live-uitzending in de herhaling?</b> De herhaaltijden van de bron staan eronder. Heeft de bron die niet, dan kies je een dag en tijd.</li></ol><p>${m(3)} Klik op ${ui('Nu live gaan')}. Bij een camera bevestig je alleen.</p>` },
 { t: 'Terug naar de planning', img: ['44-je-bent-live', 'De melding Je bent live met Raadzaal Velsen live, met Opname loopt en de knop Terug naar de planning.'],
   b: `<p>${m(2)} Je ziet sinds wanneer je live bent, of de opname loopt en of hij in de herhaling gaat.</p><p>${m(1)} Klaar? Klik op ${ui('Terug naar de planning')}. De opname stopt, gaat naar de bibliotheek en de herhalingen worden ingepland.</p>
   <div class="warn"><b>De planning wacht op jou</b>Zolang je live bent, staat de planning stil. Vergeet dus niet terug te gaan naar de planning.</div>` },
],
opnames: [
 { t: 'Wat er vanzelf gebeurt', text: true,
   b: `<div class="two"><div><ul><li><b>Start:</b> zodra er een stream binnenkomt op een live bron. Inzenders testen vaak eerder; dat stuk knip je er straks af.</li><li><b>Korte hapering:</b> komt de stream binnen 90 seconden terug, dan blijft het één opname.</li><li><b>Stop:</b> als de stream stopt, of 2 minuten na het einde van het geplande live-programma.</li><li><b>Naam:</b> die van het programma in de planning, anders die van de bron.</li><li>Opnames korter dan 30 seconden (teststreams) worden weggegooid.</li></ul></div>
   <div><table><tr><th>Status</th><th>Wat het betekent</th></tr><tr><td><span class="pill p-rec">Neemt op</span></td><td>Loopt nog.</td></tr><tr><td><span class="pill p-proc">Verwerken</span></td><td>Wordt één bestand, duurt seconden.</td></tr><tr><td><span class="pill p-wait">Klaar om na te kijken</span></td><td>Knip hem bij, zet hem in de bibliotheek.</td></tr><tr><td><span class="pill p-ok">In bibliotheek</span></td><td>In te plannen als elke andere clip.</td></tr><tr><td><span class="pill p-bad">Mislukt</span></td><td>Er ging een mail naar de beheerder.</td></tr></table></div></div>` },
 { t: 'De lijst met opnames', img: ['50-opnames', 'De pagina Opnames met twee opnames en hun knoppen.'],
   b: `<p>Ga naar ${ui('Bibliotheek')} en kies de tab ${ui('Opnames')}. De nieuwste staat bovenaan.</p><ol><li>${m(1)} De status: hier <i>Klaar om na te kijken</i>.</li><li>${m(2)} ${ui('Knippen')}: begin en einde bijwerken.</li><li>${m(3)} ${ui('Naar bibliotheek')}: zonder knippen in de bibliotheek zetten.</li><li>${m(4)} ${ui('Herhaling inplannen')}.</li><li>${m(5)} Deze opname staat al in de bibliotheek.</li></ol>` },
 { t: 'Knippen', img: ['51-knippen', 'Het knipvenster met filmstrook, begin- en eindtijd en de lengte na knippen.'], img2: ['52-knippen-opslaan', 'Onderaan het knipvenster de naam en de knop Opslaan en naar bibliotheek.'],
   b: `<ol><li>${m(1)} Sleep de gele handvatten op de filmstrook naar het echte begin en einde.</li><li>Of speel af tot het goede moment en klik op ${ui('Hier zetten')} ${m(3)}.</li><li>Of typ een tijd ${m(2)} ${m(4)}, bijvoorbeeld <code>2:35</code>.</li><li>Controleer met <i>Bekijk de eerste / laatste 5 seconden</i>.</li><li>${m(5)} Hier zie je de lengte na knippen.</li></ol><p>Onderaan geef je de opname een duidelijke naam en een categorie. Klik dan op ${ui('Opslaan en naar bibliotheek')}.</p>
   <div class="tip"><b>Geen kwaliteitsverlies</b>Er wordt geknipt zonder opnieuw te coderen. Het begin valt op het dichtstbijzijnde sleutelbeeld, hooguit 1 tot 2 seconden eerder.</div>` },
 { t: 'Herhaling inplannen', img: ['53-herhaling', 'Het venster Herhaling inplannen met snelknoppen en twee gekozen tijden.'],
   b: `<p>Klik op ${ui('Herhaling inplannen')}.</p><ol><li>${m(1)} Kies een snelknop: <i>Vanavond 22:00</i>, <i>Morgen 10:00</i>, morgen of volgende week op de tijd van de uitzending. Met <i>Nog een tijd</i> voeg je er meer toe.</li><li>${m(2)} Of kies zelf een datum en tijd.</li><li>Lees de melding eronder: daar staat welk programma plaats maakt.</li><li>${m(3)} Klik op ${ui('Herhaling inplannen')}.</li></ol>
   <p>Staat de opname nog niet in de bibliotheek, dan wordt hij daar eerst in gezet. De herhaling komt vanzelf in het uitzendschema en de programmagids.</p>` },
 { t: 'Automatisch per bron', img: ['54-per-bron', 'Onder Automatisch na de opname, per remote bron staan Raadzaal Velsen en Telstar stadion.'], img2: ['55-bron-instellen', 'Het venster Opname: Raadzaal Velsen met opnemen, meteen naar bibliotheek en herhaaltijden.'],
   b: `<p>Voor vaste uitzendingen, zoals de gemeenteraad, kan de eindredactie alles vooraf instellen. Open onderaan ${ui('Automatisch na de opname, per remote bron')} en klik op het potloodje.</p><ol><li>${m(1)} <b>Deze bron opnemen</b> (staat standaard aan).</li><li>${m(2)} <b>Meteen naar de bibliotheek</b>: zonder nakijken. Knippen kan daarna nog.</li><li>${m(3)} <b>Automatisch herhalen</b>, bijvoorbeeld <i>Volgende dag 10:00</i> en <i>Volgende dag 19:00</i>.</li></ol>` },
],
regionaal: [
 { t: 'De vier regionale bronnen', img: ['60-regionaal', 'De tab Regionaal met vier kaarten: Files & wegwerkzaamheden, Evenementen, Agenda gemeenteraad en 112-meldingen.'],
   b: `<p>Ga naar ${ui('Bibliotheek')}, tab ${ui('Beeldkranten')}, en klik op ${ui('Regionaal')}. Je ziet vier kaarten:</p><ul><li><b>Files &amp; wegwerkzaamheden</b>: files, pech, afsluitingen en werkzaamheden op de A9, A22, A208, de N-wegen en in de drie gemeenten. Ververst elke 5 minuten.</li><li><b>Evenementen</b>: wat er te doen is, uit een agenda-link en je eigen lijst.</li><li><b>Agenda gemeenteraad</b>: de komende raads- en commissievergaderingen van Velsen, Beverwijk en Heemskerk.</li><li><b>112-meldingen (P2000)</b>: brandweer en andere hulpdiensten, veilig gefilterd.</li></ul>
   <p>Staat er nog ${ui('Aanzetten')}? Klik erop, controleer de instellingen en klik op ${ui('Opslaan')}. Met ${ui('Berichten bekijken')} zie je wat er nu binnenkomt.</p>` },
 { t: 'Files en wegwerkzaamheden instellen', img: ['61-verkeer-instellingen', 'Het venster Instellingen van Files & wegwerkzaamheden met wegen, gemeenten en wat je wilt tonen.'],
   b: `<p>Klik bij Files &amp; wegwerkzaamheden op ${ui('Instellingen')}.</p><ul><li><b>Wegen</b> en <b>gemeenten</b>: welke wegen en plaatsen meedoen. Standaard staan de wegen rond de IJmond er al in.</li><li>Kies wat je wilt zien: files, ongelukken en pech, afsluitingen, wegwerkzaamheden en afsluitingen voor evenementen.</li><li><b>Werkzaamheden die beginnen binnen</b> … dagen: alleen werk dat binnenkort begint. Heel lange projecten laat hij standaard weg.</li><li>Rechts zie je meteen een voorbeeld met de berichten van nu.</li></ul>
   <div class="tip"><b>Waar komt het vandaan?</b>De gegevens komen van de Nationale Databank Wegverkeersgegevens (NDW). Huisnummers en vergunningnummers worden weggelaten.</div>` },
 { t: 'Evenementen toevoegen', img: ['62-evenementen', 'Het venster Evenementen met een agenda-link en een lijst met eigen evenementen.'],
   b: `<p>Bij <b>Evenementen</b> heb je twee manieren, die je ook samen kunt gebruiken:</p><ol><li><b>Agenda-link</b>: plak de link van een online agenda (een iCal-link, eindigt vaak op <code>.ics</code>, of een RSS-feed). Nieuwe evenementen komen er dan vanzelf bij.</li><li><b>Eigen lijst</b>: klik op ${ui('Evenement toevoegen')} en vul naam, datum, tijd en plaats in.</li></ol><p>Je kiest ook hoeveel dagen vooruit er getoond wordt. Afgelopen evenementen verdwijnen vanzelf.</p>` },
 { t: 'De agenda van de gemeenteraad', img: ['63-gemeenteraad', 'Het venster Agenda gemeenteraad met Velsen, Beverwijk en Heemskerk.'],
   b: `<p>Velsen, Beverwijk en Heemskerk staan er al in. De vergaderingen worden opgehaald uit de raadsinformatiesystemen van de gemeenten.</p><ul><li>Je kiest hoeveel dagen vooruit, en of vergaderingen die niet doorgaan getoond worden.</li><li>Een vergadering die niet doorgaat, krijgt dat er vanzelf bij te staan.</li></ul><div class="tip"><b>Tip</b>Combineer de agenda met een live-uitzending van de raad (hoofdstuk 3): de kijker ziet dan wanneer de vergadering is.</div>` },
 { t: '112-meldingen goedkeuren', img: ['64-p2000-keuren', 'Twee meldingen met Wacht en de knoppen Goedkeuren en Afkeuren, en een melding die op het scherm staat.'],

// Progress (per viewer, this browser only)
let done = {}; try { done = JSON.parse(localStorage.getItem('tvsm-guide-done') || '{}'); } catch (e) { done = {}; }
const save = () => { try { localStorage.setItem('tvsm-guide-done', JSON.stringify(done)); } catch (e) {} };
const count = (id) => (STEPS[id] || []).length;
const doneCount = (id) => (STEPS[id] || []).filter((_, i) => done[`${id}-${i}`]).length;

const fig = (f, big) => f ? `<figure><button class="shot" type="button" data-full="img/${f[0]}.jpg" data-cap="${f[1].replace(/"/g, '&quot;')}" aria-label="Vergroot: ${f[1].replace(/"/g, '&quot;')}"><img src="img/${f[0]}.jpg" alt="${f[1].replace(/"/g, '&quot;')}" loading="lazy"></button><figcaption>${f[1]}</figcaption></figure>` : '';

function chapterHTML(c, idx) {
  let h = `<section class="chapter" id="ch-${c.id}" data-id="${c.id}"><p class="eyebrow">${c.eyebrow}</p><h1>${c.title}</h1><p class="lead">${c.lead}</p>`;
  if (c.where) h += `<div class="where">In de app: ${c.where.map((w) => `<span class="crumb">${w}</span>`).join('<span aria-hidden="true">›</span>')}</div>`;
  if (c.video) h += `<div class="video"><video controls preload="metadata" playsinline poster="${c.video.poster}" src="${c.video.src}"></video><div class="vtext"><span class="len">VIDEO · ${c.video.len}</span><b>${c.video.title}</b><span>${c.video.text}</span><span class="printnote">De video staat in de online versie van deze handleiding.</span></div></div>`;
  if (c.id === 'start') h += welcomeHTML();
  if (STEPS[c.id]) {
    h += '<div class="steps">';
    STEPS[c.id].forEach((s, i) => {
      const key = `${c.id}-${i}`;
      h += `<article class="step${s.text ? ' textonly' : ''}${done[key] ? ' done' : ''}" id="${key}"><div class="step-text"><div class="step-head"><span class="num">${i + 1}</span><h3>${s.t}</h3></div>${s.b}<label class="donebox"><input type="checkbox" data-key="${key}" ${done[key] ? 'checked' : ''}> Gedaan</label></div>${s.img ? `<div class="shots${s.phone ? ' phone' : ''}">${fig(s.img)}${fig(s.img2)}</div>` : ''}</article>`;
    });
    h += '</div>';
  }
  if (c.id === 'vragen') h += `<div class="faq">${FAQ.map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div><h3 style="margin:40px 0 14px">Spiekbriefje: waar staat wat?</h3><div class="cheat">${CHEAT.map(([a, b]) => `<div><b>${a}</b><span>${b}</span></div>`).join('')}</div>`;
  const prev = CH[idx - 1], next = CH[idx + 1];
  h += `<div class="pager">${prev ? `<a href="#${prev.id}"><small>Vorige</small><b>${prev.short}</b></a>` : ''}${next ? `<a class="next" href="#${next.id}"><small>Volgende</small><b>${next.short}</b></a>` : ''}</div></section>`;
  return h;
}

function welcomeHTML() {
  return `<div class="cards">${CH.slice(1, 5).map((c, i) => `<a class="card" href="#${c.id}"><span class="k">${String(i + 1).padStart(2, '0')} · ${count(c.id)} stappen</span><b>${c.title}</b><span>${c.lead.split('. ')[0]}.</span></a>`).join('')}</div>
  <div class="hour"><h3>Zo is elk uur opgebouwd</h3><p>Elk uurblok bestaat uit drie delen. Jij vult alleen het middelste.</p>
  <div class="bar" role="img" aria-label="Uurbalk: vaste start, jouw items, opvulling tot het hele uur"><div class="s1">Start</div><div class="s2">Jouw items: programma’s, nieuws, reclame, infopagina</div><div class="s3">Beeldkrant tot :00</div></div>
  <div class="ticks"><span>:00</span><span>:15</span><span>:30</span><span>:45</span><span>:60</span></div>
  <div class="legend3"><span><i style="background:#2A1430"></i><b>Vaste start.</b> Zendertune en Straks-slide, komt vanzelf.</span><span><i style="background:#713C80"></i><b>Jouw items.</b> Clips, nieuws dat zichzelf kiest, reclameblok.</span><span><i style="background:#2FA6DF"></i><b>Rest van het uur.</b> Beeldkrant of webcam tot het volgende uur.</span></div></div>
  <div class="two"><div><h3 style="margin-bottom:8px">Het menu</h3><p style="margin:0 0 10px">Alles wat je voor de planning nodig hebt staat bovenaan het menu links:</p><ol style="display:grid;gap:6px;padding-left:20px;margin:0"><li>${m(1)} <b>Nu op TV</b>: wat er nu speelt.</li><li>${m(2)} <b>Weekplanning</b>: de week vullen.</li><li>${m(3)} <b>Blokken</b>: uurblokken maken.</li><li>${m(4)} <b>Bibliotheek</b>: video’s, opnames, beeldkranten, webcams en live bronnen.</li><li>${m(5)} <b>Schakelen</b>: onverwacht live gaan.</li></ol>
  <div class="tip"><b>Inloggen</b>Log in met je eigen account. Redacteuren en de eindredactie kunnen plannen; Inrichting is voor beheerders.</div></div>${fig(['02-menu', 'Het menu links met de onderdelen voor de redactie.'])}</div>`;
}

const content = document.getElementById('content');
content.innerHTML = `<div class="cover"><div><img src="img/logo-on-dark.svg" alt="IJmond360"></div><div><h1>Planning voor redacteuren</h1><p>Stap voor stap de weekplanning vullen, uurblokken bouwen, live-uitzendingen plannen en opnames herhalen in TV Station Manager.</p><div class="toc">${CH.slice(1).map((c, i) => `<div><span>${c.eyebrow.replace('Hoofdstuk ', '')}</span>${c.title}</div>`).join('')}</div></div><small>TV Station Manager 0.9.1 · november 2026 · Gemaakt met demogegevens; namen van clips en uitzendingen zijn voorbeelden.</small></div>` + CH.map(chapterHTML).join('');

function ring(id) {
  const n = count(id), d = doneCount(id), r = 12, c = 2 * Math.PI * r;
  const off = n ? c * (1 - d / n) : c;
  return `<svg class="ring" viewBox="0 0 30 30" aria-hidden="true"><circle class="bgc" cx="15" cy="15" r="${r}"></circle><circle class="fgc" cx="15" cy="15" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"></circle>${n && d === n ? '<text x="15" y="19" text-anchor="middle">✓</text>' : ''}</svg>`;
}
function renderNav() {
  const cur = current();
  document.getElementById('nav').innerHTML = CH.map((c) => `<a href="#${c.id}" ${c.id === cur ? 'aria-current="page"' : ''}>${ring(c.id)}<span>${c.short}</span>${count(c.id) ? `<small>${doneCount(c.id)}/${count(c.id)}</small>` : '<small></small>'}</a>`).join('');
}
const current = () => { const h = location.hash.slice(1); return CH.some((c) => c.id === h) ? h : 'start'; };
function show() {
  const cur = current();
  document.querySelectorAll('.chapter').forEach((s) => s.classList.toggle('off', s.dataset.id !== cur));
  document.querySelectorAll('video').forEach((v) => { if (!v.closest('.chapter').classList.contains('off')) return; v.pause(); });
  renderNav(); window.scrollTo({ top: 0 }); const a = document.querySelector('.nav [aria-current]'); const side = document.querySelector('.side'); if (a && side.scrollWidth > side.clientWidth) side.scrollLeft = a.offsetLeft - 100;
}
window.addEventListener('hashchange', show); show();

content.addEventListener('change', (e) => {
  const k = e.target.dataset && e.target.dataset.key; if (!k) return;
  if (e.target.checked) done[k] = 1; else delete done[k];
  e.target.closest('.step').classList.toggle('done', e.target.checked); save(); renderNav();
});
document.getElementById('reset').addEventListener('click', () => { done = {}; save(); document.querySelectorAll('[data-key]').forEach((i) => { i.checked = false; i.closest('.step').classList.remove('done'); }); renderNav(); });

const lb = document.getElementById('lb');
content.addEventListener('click', (e) => { const b = e.target.closest('.shot'); if (!b) return; document.getElementById('lbimg').src = b.dataset.full; document.getElementById('lbimg').alt = b.dataset.cap; document.getElementById('lbcap').textContent = b.dataset.cap; lb.hidden = false; });
lb.addEventListener('click', () => { lb.hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lb.hidden = true; });
</script>

</body>
