# Every push to `production` or `test` publishes a GitHub release with a .deb per app.
#   production -> v<version>            (normal release)
#   test       -> v<version>-test.<run> (pre-release)
# Installed apps pick these up from Info -> Check for updates, depending on their channel.
name: Release
on:
  push:
    branches: [production, test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Determine version
        id: v
        run: |
          BASE=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" = "production" ]; then
            VERSION="$BASE"; PRE=false
          else
            VERSION="$BASE-test.$GITHUB_RUN_NUMBER"; PRE=true
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists. Bump the version in package.json to publish a new production release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.v.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.v.outputs.skip != 'true'
        run: pnpm typecheck && pnpm test

      - name: Build apps and packages
        if: steps.v.outputs.skip != 'true'
        env:
          TVSM_VERSION: ${{ steps.v.outputs.version }}
        run: |
          for app in orchestrator agent; do
            pnpm --filter "@tvsm/$app" build
            packaging/debian/build-deb.sh "$app" "$TVSM_VERSION" build
          done
          packaging/windows/build-zip.sh "$TVSM_VERSION" build
          (cd build && sha256sum *.deb *.zip > SHA256SUMS && cat SHA256SUMS)

      - name: Publish release
        if: steps.v.outputs.skip != 'true'
        run: |
          FLAGS="--generate-notes --target $GITHUB_SHA"
          [ "${{ steps.v.outputs.prerelease }}" = "true" ] && FLAGS="$FLAGS --prerelease" || FLAGS="$FLAGS --latest"
          gh release create "v${{ steps.v.outputs.version }}" build/*.deb build/*.zip build/SHA256SUMS \
            --title "v${{ steps.v.outputs.version }} (${GITHUB_REF_NAME})" $FLAGS
